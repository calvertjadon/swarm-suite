# Swarm gate tool defaults — seeded by onboarding; the human's choices are
# recorded in scripts/gates/tools.yml, which wins per key.
# Contract: two-level map <lang> -> <role> -> one shell command run with
# `bash -c` from the repository root; exit code 0 = pass.  Values are
# single-line double-quoted scalars; \\ and \" decode left-to-right, all
# other backslashes are literal.
py:
  coder: "python3 -m pytest && python3 -m behave features/"
  cleaner: "python3 -m pytest --cov=app --cov-fail-under=90 && python3 tools/crap.py --max 6 app && ! grep -rnE 'TODO|FIXME|XXX|print\\(|pdb' app"
  architect: "! grep -rnE '^(from|import) (tests|scripts)' app"
  hardener: "mutmut run && out=\"$(mutmut results --all false)\" && [ -z \"$out\" ]"
go:
  coder: "go test ./... && go test ./features/"
  cleaner: "go test ./... && out=\"$(gocyclo -over 6 . 2>&1 || true)\" && { [ -z \"$out\" ] || { printf '%s\\n' \"$out\" >&2; exit 1; }; } && ! grep -rnE 'TODO|FIXME|XXX|fmt\\.Println' --include='*.go' ."
  architect: "! grep -rnE 'import \"(tests|scripts)' --include='*.go' ."
  hardener: "gremlins unleash --threshold-efficacy 100 ./..."
ts:
  coder: "npm test && npx cucumber-js --strict"
  cleaner: "npm test -- --coverage --coverageThreshold='{\"global\":{\"lines\":90}}' && npx eslint --rule 'complexity: [\"error\", 6]' && ! grep -rnE 'TODO|FIXME|XXX|console\\.log' src"
  architect: "! grep -rnE \"(require|from) ['\\\"](tests|scripts)\" src"
  hardener: "npx stryker run"
